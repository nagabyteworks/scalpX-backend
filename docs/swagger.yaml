openapi: 3.0.3
info:
  title: scalpX Backend API
  version: 1.0.0
  description: LIVE backend for direct Android market display and Flattrade options trading.
servers:
  - url: https://trade.nagabyte.com
paths:
  /api/market-data/sensex:
    get:
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Authoritative live SENSEX market data
  /api/option-chain:
    get:
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Authoritative option-chain data
  /api/orders/one-click:
    post:
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Broker entry lifecycle result
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
